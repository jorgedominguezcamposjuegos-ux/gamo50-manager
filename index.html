<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    /** @jsx React.createElement */
    /** @jsxFrag React.Fragment */
    const { 
      ThemeProvider, createTheme, CssBaseline, 
      Container, Typography, Box, Paper, Grid,
      TextField, Button, Select, MenuItem, InputLabel, FormControl,
      Table, TableBody, TableCell, TableContainer, TableHead, TableRow,
      Alert, Dialog, DialogTitle, DialogContent, DialogActions,
      Chip, Divider, Card, CardContent, CircularProgress, IconButton,
      Tabs, Tab, Snackbar
    } = MaterialUI;

    const theme = createTheme({
      typography: { fontFamily: 'Inter, sans-serif' },
      palette: {
        primary: { main: '#1e3a8a' }, 
        secondary: { main: '#0284c7' },
        error: { main: '#d32f2f' },
        background: { default: '#f8fafc' }
      },
      shape: { borderRadius: 8 }
    });

    function TabPanel(props) {
      const { children, value, index, ...other } = props;
      return (
        <div role="tabpanel" hidden={value !== index} {...other}>
          {value === index && <Box sx={{ pt: 3 }}>{children}</Box>}
        </div>
      );
    }

    function generarOpcionesMeses() {
      const meses = [];
      const hoy = new Date();
      for(let i = -12; i <= 24; i++) {
        const d = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const val = `${year}-${month}`;
        const label = d.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
        meses.push({ val, label: label.charAt(0).toUpperCase() + label.slice(1) });
      }
      return meses;
    }
    const OPCIONES_MESES = generarOpcionesMeses();

    function formatearFecha(valor) {
      if (!valor) return '';
      if (typeof valor === 'string') {
        const coincidencia = valor.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (coincidencia) return `${coincidencia[3]}/${coincidencia[2]}/${coincidencia[1].slice(-2)}`;
      }
      if (valor.toDate) valor = valor.toDate();
      const fecha = valor instanceof Date ? valor : new Date(valor);
      if (Number.isNaN(fecha.getTime())) return String(valor);
      return `${String(fecha.getDate()).padStart(2, '0')}/${String(fecha.getMonth() + 1).padStart(2, '0')}/${String(fecha.getFullYear()).slice(-2)}`;
    }

    function App() {
      const [tabValue, setTabValue] = React.useState(0);
      const [data, setData] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [fechaConsultaInicio, setFechaConsultaInicio] = React.useState(new Date().toISOString().split('T')[0]);
      const [fechaConsultaFin, setFechaConsultaFin] = React.useState(new Date().toISOString().split('T')[0]);
      const [disponibilidad, setDisponibilidad] = React.useState(null);
      
      const [formData, setFormData] = React.useState({ policia_id: '', tipo: 'VA', fecha_inicio: '', fecha_fin: '' });
      const [filtroEquipoFormulario, setFiltroEquipoFormulario] = React.useState('Todos');
      const [filtroSODisponibles, setFiltroSODisponibles] = React.useState('Todos');
      const [filtroSOPermisos, setFiltroSOPermisos] = React.useState('Todos');

      const [snackbar, setSnackbar] = React.useState({ open: false, message: '', severity: 'success' });
      const [confirmDialog, setConfirmDialog] = React.useState(null);

      const [comisiones, setComisiones] = React.useState([]);
      const [selectedComisionId, setSelectedComisionId] = React.useState('');
      const [efectivosComision, setEfectivosComision] = React.useState(null);
      const [dialogNuevaComision, setDialogNuevaComision] = React.useState(false);
      const [newComision, setNewComision] = React.useState({ localidad: '', fecha_inicio: '', fecha_fin: '' });
      const [newAgregado, setNewAgregado] = React.useState({ nombre: '', categoria: 'Policía', origen: '', equipo: '' });
      const [observaciones, setObservaciones] = React.useState('');
      const [guardandoObs, setGuardandoObs] = React.useState(false);

      const [consultaAgenteId, setConsultaAgenteId] = React.useState('');
      const hoy = new Date();
      const mesActual = String(hoy.getMonth() + 1).padStart(2, '0');
      const anioActual = hoy.getFullYear();
      const [consultaMes, setConsultaMes] = React.useState(`${anioActual}-${mesActual}`);
      const [filtroEOConsulta, setFiltroEOConsulta] = React.useState('Todos');
      const [dialogPermisoCalendar, setDialogPermisoCalendar] = React.useState(false);
      const [calendarFormData, setCalendarFormData] = React.useState({ id: '', policia_id: '', tipo: 'VA', fecha_inicio: '', fecha_fin: '' });

      // Estado para Resumen Bloque
      const [selectedBloque, setSelectedBloque] = React.useState(325);
      const [anotacionesBloque, setAnotacionesBloque] = React.useState({});
      const [dialogPermisoBloque, setDialogPermisoBloque] = React.useState(false);
      const [bloqueFormData, setBloqueFormData] = React.useState({ id: '', policia_id: '', tipo: 'VA', fecha_inicio: '', fecha_fin: '' });

      // Estado para anotaciones de Integrantes G50
      const [anotacionesG50, setAnotacionesG50] = React.useState('');
      const [guardandoAnotacionG50, setGuardandoAnotacionG50] = React.useState(false);

      // Estado para Servicios Bloque
      const [selectedBloqueServicios, setSelectedBloqueServicios] = React.useState(325);
      const [serviciosBloque, setServiciosBloque] = React.useState({});
      const [dialogServicio, setDialogServicio] = React.useState(false);
      const [servicioFormData, setServicioFormData] = React.useState({
        id: '',
        fecha: '',
        servicio: '',
        hora_inicio: '',
        hora_fin: '',
        personal: 1
      });

      // Generar bloques de 28 días
      const generarBloques = () => {
        const bloques = [];
        const bloqueInicio = 325;
        const fechaInicioBloque325 = new Date(2026, 5, 29); // 29 de junio de 2026 (mes 5 = junio en JS)
        
        for (let i = 0; i < 24; i++) {
          const numBloque = bloqueInicio + i;
          const diasDesdeInicio = i * 28;
          const fechaInicio = new Date(fechaInicioBloque325);
          fechaInicio.setDate(fechaInicio.getDate() + diasDesdeInicio);
          
          const fechaFin = new Date(fechaInicio);
          fechaFin.setDate(fechaFin.getDate() + 27);
          
          // Generar fechas en formato YYYY-MM-DD usando zona horaria local
          const inicioYear = fechaInicio.getFullYear();
          const inicioMonth = String(fechaInicio.getMonth() + 1).padStart(2, '0');
          const inicioDay = String(fechaInicio.getDate()).padStart(2, '0');
          
          const finYear = fechaFin.getFullYear();
          const finMonth = String(fechaFin.getMonth() + 1).padStart(2, '0');
          const finDay = String(fechaFin.getDate()).padStart(2, '0');
          
          bloques.push({
            numero: numBloque,
            inicio: `${inicioYear}-${inicioMonth}-${inicioDay}`,
            fin: `${finYear}-${finMonth}-${finDay}`,
            label: `Bloque ${numBloque} (${formatearFecha(fechaInicio)} - ${formatearFecha(fechaFin)})`
          });
        }
        return bloques;
      };

      const bloques = generarBloques();
      const bloqueSeleccionado = bloques.find(b => b.numero === selectedBloque) || bloques[0];

      // Obtener días del bloque
      const obtenerDiasBloque = (bloque) => {
        const dias = [];
        const inicio = new Date(bloque.inicio);
        for (let i = 0; i < 28; i++) {
          const fecha = new Date(inicio);
          fecha.setDate(fecha.getDate() + i);
          const year = fecha.getFullYear();
          const month = String(fecha.getMonth() + 1).padStart(2, '0');
          const day = String(fecha.getDate()).padStart(2, '0');
          dias.push({
            fecha: `${year}-${month}-${day}`,
            diaSemana: fecha.getDay(), // 0 = domingo, 1 = lunes, etc.
            diaMes: fecha.getDate()
          });
        }
        return dias;
      };

      const diasBloque = obtenerDiasBloque(bloqueSeleccionado);

      const fechaClave = (valor) => {
        if (!valor) return '';
        if (typeof valor === 'string') return valor.slice(0, 10);
        if (valor.toDate) valor = valor.toDate();
        if (valor instanceof Date && !Number.isNaN(valor.getTime())) {
          const year = valor.getFullYear();
          const month = String(valor.getMonth() + 1).padStart(2, '0');
          const day = String(valor.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        }
        return String(valor).slice(0, 10);
      };

      // Obtener estado de un empleado en un día específico
      const obtenerEstadoEmpleado = (empleado, fecha) => {
        const fechaDia = fechaClave(fecha);
        // Los permisos/situaciones administrativas tienen prioridad en su fecha concreta.
        const permiso = data.permisos.find(p => {
          const inicio = fechaClave(p.fecha_inicio);
          const fin = fechaClave(p.fecha_fin);
          return p.policia_id === empleado.id && fechaDia >= inicio && fechaDia <= fin;
        });
        if (permiso) return { 
          id: permiso.id, 
          policia_id: permiso.policia_id,
          tipo: permiso.tipo, 
          fecha_inicio: permiso.fecha_inicio,
          fecha_fin: permiso.fecha_fin,
          esPermiso: true 
        };

        // Verificar si está activo
        if (!isAgentActiveOnDate(empleado.nombre, new Date(`${fechaDia}T00:00:00`))) {
          return { tipo: 'BAJA', esBaja: true };
        }

        // Una comisión solo se muestra si el efectivo era elegible para todo su periodo.
        const comision = data.comisiones_servicio.find(c => {
          const inicio = fechaClave(c.fecha_inicio);
          const fin = fechaClave(c.fecha_fin);
          return fechaDia >= inicio && fechaDia <= fin && !c.excluidos_manuales?.includes(empleado.id);
        });
        if (comision) {
          const inicioComision = fechaClave(comision.fecha_inicio);
          const finComision = fechaClave(comision.fecha_fin);
          const tieneSituacionSolapada = data.permisos.some(p => {
            if (p.policia_id !== empleado.id) return false;
            const inicioPermiso = fechaClave(p.fecha_inicio);
            const finPermiso = fechaClave(p.fecha_fin);
            return inicioPermiso <= finComision && finPermiso >= inicioComision;
          });
          let tieneBajaDuranteComision = false;
          const cursor = new Date(`${inicioComision}T00:00:00`);
          const finCursor = new Date(`${finComision}T00:00:00`);
          while (cursor <= finCursor) {
            if (!isAgentActiveOnDate(empleado.nombre, cursor)) {
              tieneBajaDuranteComision = true;
              break;
            }
            cursor.setDate(cursor.getDate() + 1);
          }
          if (tieneSituacionSolapada || tieneBajaDuranteComision) return null;
          return { tipo: 'CS', localidad: comision.localidad, esComision: true };
        }

        return null; // Disponible o sin turno
      };

      // Obtener color según tipo
      const obtenerColorEstado = (estado) => {
        if (!estado) return 'transparent';
        switch(estado.tipo) {
          case 'AP': return '#3b82f6';
          case 'VA': return '#f97316';
          case 'AFG': return '#a855f7';
          case 'PT': return '#22c55e';
          case 'CS': return '#eab308';
          case 'CSA': return '#06b6d4';
          case 'BJ': return '#ef4444';
          case 'BAJA': return '#6b7280';
          default: return '#ef4444';
        }
      };

      // Guardar anotación manual
      const guardarAnotacion = (empleadoId, valor) => {
        setAnotacionesBloque(prev => ({
          ...prev,
          [`${selectedBloque}_${empleadoId}`]: valor
        }));
      };

      // Generar PDF del bloque
      const generarPDFBloque = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4'); // Horizontal, A4
        
        doc.setFontSize(16);
        doc.text(`Resumen Bloque ${selectedBloque} - Gamo 50`, 14, 15);
        
        doc.setFontSize(10);
        doc.text(`Periodo: ${formatearFecha(bloqueSeleccionado.inicio)} al ${formatearFecha(bloqueSeleccionado.fin)}`, 14, 22);

        // Preparar datos para la tabla
        const head = [['Gamo', 'Categoría', 'Nombre', ...diasBloque.map(d => `${['D', 'L', 'M', 'X', 'J', 'V', 'S'][d.diaSemana]} ${d.diaMes}`), 'Anotación']];
        
        const body = [];
        Object.entries(
          data.efectivos
            .filter(e => e.categoria !== 'EM')
            .reduce((acc, empleado) => {
              const equipo = empleado.equipo || 'Sin Equipo';
              if (!acc[equipo]) acc[equipo] = [];
              acc[equipo].push(empleado);
              return acc;
            }, {})
        )
        .sort(([a], [b]) => a.localeCompare(b))
        .forEach(([equipo, empleados]) => {
          body.push([`${etiquetaGamo(equipo)} (${empleados.length})`, '', '', ...Array(diasBloque.length).fill(''), '']);
          empleados
            .sort((a, b) => {
              const catOrder = { 'Inspector': 0, 'Subinspector': 1, 'Oficial': 2, 'Policía': 3 };
              return catOrder[a.categoria] - catOrder[b.categoria] || a.nombre.localeCompare(b.nombre);
            })
            .forEach(empleado => {
              const row = [empleado.equipo, empleado.categoria, empleado.nombre];
              diasBloque.forEach(dia => {
                const estado = obtenerEstadoEmpleado(empleado, dia.fecha);
                row.push(estado ? estado.tipo : '');
              });
              row.push(anotacionesBloque[`${selectedBloque}_${empleado.id}`] || '');
              body.push(row);
            });
        });

        doc.autoTable({
          startY: 28,
          head: head,
          body: body,
          theme: 'grid',
          headStyles: { fillColor: [30, 58, 138], fontSize: 6 },
          bodyStyles: { fontSize: 6 },
          columnStyles: {
            0: { cellWidth: 20 },
            1: { cellWidth: 18 },
            2: { cellWidth: 32 },
            ...Object.fromEntries(diasBloque.map((_, i) => [i + 3, { cellWidth: 8, halign: 'center' }])),
            [diasBloque.length + 3]: { cellWidth: 15 }
          },
          margin: { left: 5, right: 5, top: 28, bottom: 10 },
          styles: { overflow: 'linebreak' }
        });

        doc.save(`Resumen_Bloque_${selectedBloque}.pdf`);
      };

      React.useEffect(() => {
        // Esperar a que Firebase esté inicializado
        const checkFirebase = () => {
          if (window.firebaseInitialized === true) {
            initializeFirebase();
          } else if (window.firebaseInitialized === false) {
            setSnackbar({ open: true, message: 'Error: ' + (window.firebaseError || 'Firebase no se inicializó'), severity: 'error' });
            setLoading(false);
          } else {
            // Firebase aún no está listo, reintentar en 100ms
            setTimeout(checkFirebase, 100);
          }
        };
        checkFirebase();
      }, []);

      const initializeFirebase = async () => {
        try {
          if (!window.firebaseInitialized) {
            setSnackbar({ open: true, message: 'Error: Firebase no se inicializó correctamente.', severity: 'error' });
            setLoading(false);
            return;
          }
          
          await fetchData();
        } catch (error) {
          console.error('Error inicializando Firebase:', error);
          setSnackbar({ open: true, message: 'Error conectando a Firebase: ' + error.message, severity: 'error' });
          setLoading(false);
        }
      };

      const fetchData = async () => {
        try {
          console.log('📥 Iniciando carga de datos desde Firebase...');
          const db = window.firebaseDB;
          console.log('🔥 DB:', db);
          
          // Fetch efectivos
          console.log('📦 Cargando efectivos...');
          const efectivosSnapshot = await db.collection('efectivos').get();
          console.log('✅ Efectivos snapshot:', efectivosSnapshot.size, 'documentos');
          const efectivos = efectivosSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          
          // Fetch permisos
          console.log('📦 Cargando permisos...');
          const permisosSnapshot = await db.collection('permisos').get();
          console.log('✅ Permisos snapshot:', permisosSnapshot.size, 'documentos');
          let permisos = permisosSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          
          // Filtrar permisos eliminados (localStorage)
          const eliminados = JSON.parse(localStorage.getItem('permisosEliminados') || '[]');
          if (eliminados.length > 0) {
            console.log('🗑️ Filtrando permisos eliminados:', eliminados);
            permisos = permisos.filter(p => !eliminados.includes(p.id));
          }
          
          // Fetch comisiones
          console.log('📦 Cargando comisiones...');
          const comisionesSnapshot = await db.collection('comisiones').get();
          console.log('✅ Comisiones snapshot:', comisionesSnapshot.size, 'documentos');
          const comisionesData = comisionesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

          // Fetch servicios de bloque para que estén disponibles en cualquier dispositivo
          const serviciosSnapshot = await db.collection('servicios').get();
          const serviciosFirebase = {};
          serviciosSnapshot.docs.forEach(doc => {
            const servicio = { id: doc.id, ...doc.data() };
            if (!serviciosFirebase[servicio.fecha]) serviciosFirebase[servicio.fecha] = [];
            serviciosFirebase[servicio.fecha].push(servicio);
          });
          
          // Cargar anotaciones de G50 (manejar caso donde colección no existe)
          try {
            const anotacionesG50Doc = await db.collection('config').doc('anotaciones_g50').get();
            if (anotacionesG50Doc.exists) {
              setAnotacionesG50(anotacionesG50Doc.data().texto || '');
            }
          } catch (error) {
            console.warn('⚠️ No se pudieron cargar anotaciones G50 (colección config puede no existir):', error.message);
          }
          
          console.log('✅ Datos cargados desde Firebase:', { efectivos: efectivos.length, permisos: permisos.length, comisiones: comisionesData.length });
          setData({ efectivos, permisos, comisiones_servicio: comisionesData });
          setComisiones(comisionesData);
          
          // Usar Firebase como fuente compartida; conservar localStorage como respaldo/migración
          const serviciosGuardados = localStorage.getItem('serviciosBloque');
          const serviciosLocales = serviciosGuardados ? JSON.parse(serviciosGuardados) : {};
          if (serviciosSnapshot.empty && Object.keys(serviciosLocales).length > 0) {
            setServiciosBloque(serviciosLocales);
            const migracion = db.batch();
            Object.entries(serviciosLocales).forEach(([fecha, servicios]) => {
              servicios.forEach(servicio => {
                const servicioMigrado = { ...servicio, fecha: servicio.fecha || fecha };
                const ref = db.collection('servicios').doc(servicioMigrado.id);
                migracion.set(ref, { ...servicioMigrado, migratedAt: firebase.firestore.FieldValue.serverTimestamp() });
              });
            });
            await migracion.commit();
            console.log('✅ Servicios locales migrados a Firebase');
          } else {
            setServiciosBloque(serviciosFirebase);
          }
          
          setLoading(false);
        } catch (error) {
          console.error('❌ Error cargando datos desde Firebase:', error);
          console.log('🔄 Intentando cargar datos del archivo local...');
          
          // Fallback: cargar del archivo JSON local
          try {
            const response = await fetch('data.json');
            const localData = await response.json();
            let permisos = localData.permisos || [];
            
            // Filtrar permisos eliminados (localStorage)
            const eliminados = JSON.parse(localStorage.getItem('permisosEliminados') || '[]');
            if (eliminados.length > 0) {
              console.log('🗑️ Filtrando permisos eliminados (local):', eliminados);

      const ordenCategoria = { 'Inspector': 0, 'Subinspector': 1, 'Oficial': 2, 'Policía': 3 };
      const valorOrdenOrganico = (valor) => {
        const texto = String(valor || '').trim().toUpperCase();
        if (texto === 'EM' || texto === 'GAMO 50' || texto === '50') return 0;
        const numero = Number(texto.replace(/\D/g, ''));
        return Number.isFinite(numero) && numero > 0 ? numero : 9999;
      };
      const compararClavesOrganicas = (a, b) =>
        valorOrdenOrganico(a) - valorOrdenOrganico(b) ||
        String(a || '').localeCompare(String(b || ''), 'es', { numeric: true });
      const etiquetaGamo = (valor) => {
        const texto = String(valor || '').trim();

      };
      const compararOrdenOperativo = (a, b) =>
        compararClavesOrganicas(a.so, b.so) ||
        compararClavesOrganicas(a.equipo, b.equipo) ||
        (ordenCategoria[a.categoria] ?? 99) - (ordenCategoria[b.categoria] ?? 99) ||
        String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es', { sensitivity: 'base' });

        const pIni = new Date(p.fecha_inicio);
        const pFin = new Date(p.fecha_fin);
        const matchFecha = Math.max(targetIni, pIni) <= Math.min(targetFin, pFin);
        return matchSO && matchFecha;
      }).sort((a, b) => {

          fechaClave(a.fecha_inicio).localeCompare(fechaClave(b.fecha_inicio));

      const selectedComObj = comisiones.find(c => c.id === selectedComisionId);
      const efectivosFiltradosConsulta = data.efectivos.filter(p => filtroEOConsulta === 'Todos' || p.equipo === filtroEOConsulta);

      let agrupadosPorEO = {};
      let totalSO = {};
      let totalGO = 0;
      let resumenEscalasComision = '00 00 00 00';
      
      if (efectivosComision) {
        const todos = [
          ...efectivosComision.elegibles.map(e => ({...e, esAgregado: false})),
          ...efectivosComision.agregados.map(a => ({...a, esAgregado: true, so: a.so || 'AGREGADO'}))
        ];
        totalGO = todos.length;
        resumenEscalasComision = ['Inspector', 'Subinspector', 'Oficial', 'Policía']
          .map(categoria => String(todos.filter(p => p.categoria === categoria).length).padStart(2, '0'))
          .join(' ');
        todos.forEach(p => {
          const eq = p.equipo || 'Sin Equipo';
          if (!agrupadosPorEO[eq]) agrupadosPorEO[eq] = [];
          agrupadosPorEO[eq].push(p);

          let calcSO = p.so;
          if (p.esAgregado) {
             const realAgent = data.efectivos.find(e => e.equipo === eq);
             if (realAgent) calcSO = realAgent.so;
          }
          if (calcSO && calcSO !== 'AGREGADO') {
            totalSO[calcSO] = (totalSO[calcSO] || 0) + 1;
          }
        });
      }

      const generarCuadranteExcel = () => {
        if (!selectedComObj) return;
        const origenEnExcel = (componente) => componente.esAgregado
          ? (componente.origen || 'Origen no indicado')
          : '';
        
        // Obtener todos los efectivos de la comisión (incluyendo agregados)
        const todos = Object.values(agrupadosPorEO).flat();

        // Identificar jefe de grupo (funcion: "Mando")
        const jefeGrupo = todos.find(p => p.funcion === 'Mando');
        
        // Equipo de mando (SO = "EM")
        const equipoMando = todos.filter(p => p.so === 'EM' && p.funcion !== 'Mando').sort(compararOrdenOperativo);
        
        // Resto de componentes (incluyendo JSO y agregados)
        const componentes = todos.filter(p => p.so !== 'EM');

        // Crear array para los datos del Excel
        const datosExcel = [];

        // Agregar información de la comisión
        datosExcel.push(['INFORMACIÓN DE LA COMISIÓN']);
        datosExcel.push(['Comisión:', selectedComObj.localidad]);
        datosExcel.push(['Periodo:', `${formatearFecha(selectedComObj.fecha_inicio)} al ${formatearFecha(selectedComObj.fecha_fin)}`]);
        datosExcel.push(['Total Efectivos:', totalGO]);
        datosExcel.push([]); // Fila vacía

        // Sección de EQUIPO DE MANDO (jefe de grupo + equipo de mando)
        if (jefeGrupo || equipoMando.length > 0) {
          datosExcel.push(['EQUIPO DE MANDO']);
          datosExcel.push(['Nº', 'Nombre', 'Categoría', 'Función', 'SO', 'Destino', 'Origen']);
          
          let numeroMando = 1;
          
          // Primero el jefe de grupo
          if (jefeGrupo) {
            datosExcel.push([
              numeroMando++,
              jefeGrupo.nombre,
              jefeGrupo.categoria,
              jefeGrupo.funcion,
              jefeGrupo.so,
              etiquetaGamo(jefeGrupo.equipo),
              origenEnExcel(jefeGrupo)
            ]);
          }
          
          // Luego el equipo de mando
          equipoMando.forEach(componente => {
            datosExcel.push([
              numeroMando++,
              componente.nombre,
              componente.categoria,
              componente.funcion,
              componente.so,
              etiquetaGamo(componente.equipo),
              origenEnExcel(componente)
            ]);
          });
          
          datosExcel.push([]); // Fila vacía
        }

        // Agrupar componentes por SO y luego por equipo
        const agrupadosPorSO = {};
        componentes.forEach(p => {
          const so = p.so || 'Sin SO';
          if (!agrupadosPorSO[so]) {
            agrupadosPorSO[so] = {};
          }
          const equipo = p.equipo || 'Sin equipo';
          if (!agrupadosPorSO[so][equipo]) {
            agrupadosPorSO[so][equipo] = [];
          }
          agrupadosPorSO[so][equipo].push(p);
        });

        // Aplicar el mismo orden orgánico de Integrantes G50
        const soKeys = Object.keys(agrupadosPorSO).sort(compararClavesOrganicas);

        // Generar datos para cada SO con numeración por SO
        soKeys.forEach(so => {
          datosExcel.push([`SUBGRUPO OPERATIVO SO ${so}`]);
          datosExcel.push(['Nº', 'Nombre', 'Categoría', 'Función', 'Destino', 'Origen']);
          
          let numeroSO = 1;
          const equiposSO = agrupadosPorSO[so];
          
          const equipoKeys = Object.keys(equiposSO).sort(compararClavesOrganicas);

          equipoKeys.forEach(equipo => {
            const componentesEquipo = equiposSO[equipo];
            
            componentesEquipo.sort(compararOrdenOperativo);

            componentesEquipo.forEach(componente => {
              datosExcel.push([
                numeroSO++,
                componente.nombre,
                componente.categoria,
                componente.funcion,
                etiquetaGamo(componente.equipo),
                origenEnExcel(componente)
              ]);
            });
          });
          
          datosExcel.push([]); // Fila vacía entre SO
        });

        // Agregar observaciones si existen
        if (observaciones) {
          datosExcel.push(['OBSERVACIONES']);
          datosExcel.push([observaciones]);
        }

        // Crear libro de Excel
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(datosExcel);
        
        // Ajustar ancho de columnas
        ws['!cols'] = [
          { wch: 5 },  // Nº
          { wch: 30 }, // Nombre
          { wch: 15 }, // Categoría
          { wch: 15 }, // Función
          { wch: 10 }, // Equipo
          { wch: 18 }  // Origen
        ];

        XLSX.utils.book_append_sheet(wb, ws, 'Cuadrante Comisión');
        
        // Generar y descargar archivo
        XLSX.writeFile(wb, `Cuadrante_Comision_${selectedComObj.localidad.replace(/\s+/g, '_')}.xlsx`);
      };

      // Funciones para Servicios Bloque
      const coloresServicios = ['#dbeafe', '#dcfce7', '#fef3c7', '#fce7f3', '#ede9fe', '#cffafe'];
      const obtenerNivelServicio = (personal) => {
        const cantidad = Number(personal) || 0;
        if (cantidad <= 7) return { codigo: 'EO', nombre: 'Equipo operativo' };
        if (cantidad <= 15) return { codigo: 'SO', nombre: 'Subgrupo operativo' };
        if (cantidad <= 30) return { codigo: '2SOs', nombre: '2 Subgrupos operativos' };
        return { codigo: 'GO', nombre: 'Grupo operativo' };
      };

      const abrirNuevoServicio = (fecha) => {
        setServicioFormData({ id: '', fecha, servicio: '', hora_inicio: '', hora_fin: '', personal: 1 });
        setDialogServicio(true);
      };

      const editarServicio = (fecha, servicio) => {
        setServicioFormData({
          id: servicio.id,
          fecha,
          servicio: servicio.servicio || '',
          hora_inicio: servicio.hora_inicio || '',
          hora_fin: servicio.hora_fin || '',
          personal: Number(servicio.personal) || 1
        });
        setDialogServicio(true);
      };

      const handleGuardarServicio = () => {
        if (!servicioFormData.servicio || !servicioFormData.hora_inicio) {
          alert('Por favor, completa el servicio y la hora de inicio');
          return;
        }

        const nuevoServicio = {
          id: servicioFormData.id || `servicio_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
          fecha: servicioFormData.fecha,
          servicio: servicioFormData.servicio,
          hora_inicio: servicioFormData.hora_inicio,
          hora_fin: servicioFormData.hora_fin,
          personal: servicioFormData.personal
        };

        const fecha = servicioFormData.fecha;
        const serviciosActuales = serviciosBloque[fecha] || [];
        
        if (servicioFormData.id) {
          // Editar servicio existente
          const serviciosActualizados = serviciosActuales.map(s => 
            s.id === servicioFormData.id ? nuevoServicio : s
          );
          setServiciosBloque(prev => ({
            ...prev,
            [fecha]: serviciosActualizados
          }));
        } else {
          // Añadir nuevo servicio
          setServiciosBloque(prev => ({
            ...prev,
            [fecha]: [...serviciosActuales, nuevoServicio]
          }));
        }

        if (window.firebaseDB) {
          window.firebaseDB.collection('servicios').doc(nuevoServicio.id).set({
            ...nuevoServicio,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }).catch(error => console.error('Error guardando servicio en Firebase:', error));
        }

        // Guardar en localStorage
        const serviciosPersistidos = {
          ...serviciosBloque,
          [fecha]: servicioFormData.id
            ? serviciosActuales.map(s => s.id === servicioFormData.id ? nuevoServicio : s)
            : [...serviciosActuales, nuevoServicio]
        };
        localStorage.setItem('serviciosBloque', JSON.stringify(serviciosPersistidos));

        setDialogServicio(false);
      };

      const handleEliminarServicio = (servicioId) => {
        if (!window.confirm('¿Seguro que deseas eliminar este servicio?')) return;
        
        const fecha = servicioFormData.fecha;
        const serviciosFiltrados = (serviciosBloque[fecha] || []).filter(s => s.id !== servicioId);
        
        setServiciosBloque(prev => ({
          ...prev,
          [fecha]: serviciosFiltrados
        }));

        // Actualizar localStorage
        localStorage.setItem('serviciosBloque', JSON.stringify({
          ...serviciosBloque,
          [fecha]: serviciosFiltrados
        }));

        if (window.firebaseDB) {
          window.firebaseDB.collection('servicios').doc(servicioId).delete()
            .catch(error => console.error('Error eliminando servicio de Firebase:', error));
        }

        setDialogServicio(false);
      };

      const renderCalendar = () => {
        if (!consultaAgenteId || !consultaMes) return null;
        
        const [y, m] = consultaMes.split('-');
        const year = parseInt(y, 10);
        const month = parseInt(m, 10) - 1; // JavaScript months are 0-indexed
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        
        let startDayOfWeek = firstDay.getDay() - 1;
        if (startDayOfWeek === -1) startDayOfWeek = 6;
        
        const days = [];
        for (let i = 0; i < startDayOfWeek; i++) days.push(null);
        
        for (let d = 1; d <= lastDay.getDate(); d++) {
          const date = new Date(year, month, d);
          const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push(dStr);
        }

        const empleadoConsulta = data.efectivos.find(e => e.id === consultaAgenteId);
        const getDayStatus = (dStr) => empleadoConsulta
          ? obtenerEstadoEmpleado(empleadoConsulta, dStr)
          : null;

        const getBgColor = (tipo) => {
          switch(tipo) {
            case 'AP': return '#3b82f6';
            case 'PT': return '#22c55e';
            case 'AFG': return '#a855f7';
            case 'CS': return '#eab308';
            case 'CSA': return '#06b6d4';
            case 'VA': return '#f97316';
            default: return '#ef4444';
          }
        };

        return (
          <Box>
            <Grid container spacing={1}>
              {['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => (
                <Grid item xs={12/7} key={d}>
                  <Box textAlign="center" fontWeight="bold" py={1}>{d}</Box>
                </Grid>
              ))}
              {days.map((dStr, i) => {
                if (!dStr) return <Grid item xs={12/7} key={`empty-${i}`}><Box height={80} /></Grid>;
                const st = getDayStatus(dStr);
                const dayNum = parseInt(dStr.split('-')[2], 10);
                return (
                  <Grid item xs={12/7} key={dStr}>
                    <Box 
                      onClick={() => handleDayClick(dStr, st)}
                      sx={{
                        height: 80, 
                        border: '1px solid #e2e8f0', 
                        borderRadius: 1, 
                        p: 1,
                        cursor: st?.tipo === 'CS' ? 'default' : 'pointer',
                        backgroundColor: st ? getBgColor(st.tipo) : '#fff',
                        color: st ? '#fff' : 'inherit',
                        '&:hover': { opacity: st?.tipo === 'CS' ? 1 : 0.8 }
                      }}
                    >
                      <Typography variant="body2" fontWeight="bold">{dayNum}</Typography>
                      {st && <Typography variant="caption" sx={{ display: 'block', mt: 1, lineHeight: 1.1 }}>{st.tipo === 'CS' ? `CS ${st.localidad}` : st.tipo}</Typography>}
                    </Box>
                  </Grid>
                );
              })}
            </Grid>
          </Box>
        );
      };

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <Container className="app-container" maxWidth="xl">
            <Box mb={3} display="flex" alignItems="center" justifyContent="space-between">
              <Typography variant="h4" fontWeight="700" color="primary">Gamo 50 Manager - Firebase</Typography>
            </Box>

            <Snackbar 
              open={snackbar.open} 
              autoHideDuration={6000} 
              onClose={() => setSnackbar({ ...snackbar, open: false })}
            >
              <Alert severity={snackbar.severity} onClose={() => setSnackbar({ ...snackbar, open: false })}>
                {snackbar.message}
              </Alert>
            </Snackbar>

            <Paper className="glass-card" sx={{ mb: 3 }}>
              <Tabs value={tabValue} onChange={(e, newValue) => setTabValue(newValue)} centered variant="fullWidth">
                <Tab label="Gestión en Base" className="custom-tab" />
                <Tab label="Gestión en Comisión de Servicio" className="custom-tab" />
                <Tab label="Consulta Individual" className="custom-tab" />
                <Tab label="Resumen Bloque" className="custom-tab" />
                <Tab label="Servicios Bloque" className="custom-tab" />
                <Tab label="Integrantes G50" className="custom-tab" />
              </Tabs>
            </Paper>

            {/* TAB 0: GESTION EN BASE */}
            <TabPanel value={tabValue} index={0}>
              <Grid container spacing={4}>
                <Grid item xs={12} md={4}>
                  <Paper className="glass-card" sx={{ p: 3 }}>
                    <Typography variant="h6" mb={2} fontWeight="600">Grabar Permiso</Typography>
                    <form onSubmit={handleFormSubmit}>
                      <FormControl fullWidth margin="normal" size="small">
                        <InputLabel>Filtrar por Equipo Operativo</InputLabel>
                        <Select value={filtroEquipoFormulario} label="Filtrar por Equipo Operativo" onChange={(e) => { setFiltroEquipoFormulario(e.target.value); setFormData({...formData, policia_id: ''}); }}>
                          {equiposDisponibles.map(eq => <MenuItem key={eq} value={eq}>{eq}</MenuItem>)}
                        </Select>
                      </FormControl>
                      <FormControl fullWidth margin="normal">
                        <InputLabel>Agente</InputLabel>
                        <Select value={formData.policia_id} label="Agente" onChange={(e) => setFormData({...formData, policia_id: e.target.value})} required>
                          {efectivosFiltradosForm.map(p => <MenuItem key={p.id} value={p.id}>{p.nombre} (SO {p.so} - {etiquetaGamo(p.equipo)})</MenuItem>)}
                        </Select>
                      </FormControl>
                      <FormControl fullWidth margin="normal">
                        <InputLabel>Tipo de Permiso</InputLabel>
                        <Select value={formData.tipo} label="Tipo de Permiso" onChange={(e) => setFormData({...formData, tipo: e.target.value})} required>
                          <MenuItem value="AP">AP</MenuItem><MenuItem value="VA">VA</MenuItem><MenuItem value="AFG">AFG</MenuItem><MenuItem value="CH">CH</MenuItem><MenuItem value="CU">CU</MenuItem><MenuItem value="BJ">BJ</MenuItem><MenuItem value="PT">PT</MenuItem><MenuItem value="CSA">CSA (Comisión como agregado)</MenuItem>
                        </Select>
                      </FormControl>
                      <TextField fullWidth margin="normal" label="Fecha Inicio" type="date" InputLabelProps={{ shrink: true }} inputProps={{ lang: 'es-ES' }} value={formData.fecha_inicio} onChange={(e) => setFormData({...formData, fecha_inicio: e.target.value})} required />
                      <TextField fullWidth margin="normal" label="Fecha Fin" type="date" InputLabelProps={{ shrink: true }} inputProps={{ lang: 'es-ES' }} value={formData.fecha_fin} onChange={(e) => setFormData({...formData, fecha_fin: e.target.value})} required />
                      <Button type="submit" variant="contained" fullWidth sx={{ mt: 3, py: 1.5 }} disableElevation>Registrar Permiso</Button>
                    </form>
                  </Paper>
                </Grid>

                <Grid item xs={12} md={8}>
                  <Paper className="glass-card" sx={{ p: 3, minHeight: '400px' }}>
                    <Box display="flex" justifyContent="space-between" alignItems="center" mb={3} gap={2} flexWrap="wrap">
                      <Typography variant="h6" fontWeight="600">Disponibilidad de Efectivos en Base</Typography>
                      <Box display="flex" gap={1}>

                    {disponibilidad ? (

              {selectedComisionId && efectivosComision && selectedComObj && (

                        </Button>
                      </DialogActions>
                    </Dialog>
                  </>
                );
              })()}
            </TabPanel>
            {/* TAB 5: INTEGRANTES G50 */}
            <TabPanel value={tabValue} index={5}>
              <Paper className="glass-card" sx={{ p: 3 }}>
                <Box display="flex" justifyContent="space-between" alignItems="center" mb={3}>
                  <Typography variant="h6" fontWeight="600">Composición G50</Typography>
                  <Button 
                    variant="contained" 
                    color="error" 
                    onClick={handleDeleteAgentes}
                    size="small"
                  >
                    Eliminar agentes de Firebase
                  </Button>
                </Box>

                <Box mb={4}>
                  <Typography variant="subtitle1" fontWeight="600" mb={2}>Anotaciones</Typography>
                  <TextField
                    fullWidth
                    multiline
                    rows={4}
                    value={anotacionesG50}
                    onChange={(e) => setAnotacionesG50(e.target.value)}
                    placeholder="Escribe tus anotaciones aquí..."
                    variant="outlined"
                    size="small"
                  />
                  <Box mt={1} display="flex" justifyContent="flex-end">
                    <Button
                      variant="contained"
                      color="primary"
                      onClick={handleGuardarAnotacionG50}
                      disabled={guardandoAnotacionG50}
                      size="small"
                    >
                      {guardandoAnotacionG50 ? 'Guardando...' : 'Guardar anotación'}
                    </Button>
                  </Box>
                </Box>
                
                {(() => {
                  // Agrupar por SO (Subgrupo)
                  const agrupadosPorSO = data.efectivos.reduce((acc, empleado) => {
                    const so = empleado.so || 'Sin SO';
                    if (!acc[so]) acc[so] = [];
                    acc[so].push(empleado);
                    return acc;
                  }, {});

                  // Agrupar por Equipo dentro de cada SO
                  const estructura = Object.keys(agrupadosPorSO).sort(compararClavesOrganicas).map(so => {
                    const agentesSO = agrupadosPorSO[so];
                    const agrupadosPorEquipo = agentesSO.reduce((acc, empleado) => {
                      const equipo = empleado.equipo || 'Sin Equipo';
                      if (!acc[equipo]) acc[equipo] = [];
                      acc[equipo].push(empleado);
                      return acc;
                    }, {});

                    return {
                      so,
                      totalSO: agentesSO.length,
                      equipos: Object.keys(agrupadosPorEquipo).sort(compararClavesOrganicas).map(equipo => ({
                        equipo,
                        totalEquipo: agrupadosPorEquipo[equipo].length,
                        agentes: agrupadosPorEquipo[equipo].sort(compararOrdenOperativo)
                      }))
                    };
                  });

                  const totalGrupo = data.efectivos.length;

                  return (
                    <Box>
                      <Typography variant="h5" fontWeight="bold" mb={3}>
                        Composición G50: {totalGrupo} agentes
                      </Typography>

                      {estructura.map(({ so, totalSO, equipos }) => (
                        <Box key={so} mb={4}>
                          <Typography variant="h6" fontWeight="bold" color="primary" mb={2}>
                            {so === 'EM' ? 'Gamo 50 (Equipo de Mando)' : `Gamo ${so}`}: {totalSO} agentes
                          </Typography>

                          {equipos.map(({ equipo, totalEquipo, agentes }) => (
                            <Box key={equipo} mb={3} ml={3}>
                              <Typography variant="subtitle1" fontWeight="600" color="secondary" mb={2}>
                                {etiquetaGamo(equipo)}: {totalEquipo} agentes
                              </Typography>

                              <TableContainer sx={{ maxWidth: 800 }}>
                                <Table size="small">
                                  <TableHead>
                                    <TableRow>
                                      <TableCell sx={{ fontWeight: 'bold' }}>Nombre</TableCell>
                                      <TableCell sx={{ fontWeight: 'bold' }}>Categoría</TableCell>
                                      <TableCell sx={{ fontWeight: 'bold' }}>Gamo</TableCell>
                                    </TableRow>
                                  </TableHead>
                                  <TableBody>
                                    {agentes.map(agente => (
                                      <TableRow key={agente.id}>
                                        <TableCell>{agente.nombre}</TableCell>
                                        <TableCell>{agente.categoria}</TableCell>
                                        <TableCell>{etiquetaGamo(agente.equipo)}</TableCell>
                                      </TableRow>
                                    ))}
                                  </TableBody>
                                </Table>
                              </TableContainer>
                            </Box>
                          ))}
                        </Box>
                      ))}
                    </Box>
                  );
                })()}
              </Paper>
            </TabPanel>

            <Dialog open={dialogPermisoCalendar} onClose={() => setDialogPermisoCalendar(false)}>
              <form onSubmit={handleCalendarSubmit}>
                <DialogTitle>{calendarFormData.id ? 'Modificar Permiso' : 'Añadir Permiso en Calendario'}</DialogTitle>
                <DialogContent>
                  <FormControl fullWidth margin="dense" size="small" sx={{ mt: 2 }}>
                    <InputLabel>Tipo de Permiso</InputLabel>
                    <Select value={calendarFormData.tipo} label="Tipo de Permiso" onChange={(e) => setCalendarFormData({...calendarFormData, tipo: e.target.value})} required>
                      <MenuItem value="AP">AP</MenuItem><MenuItem value="VA">VA</MenuItem><MenuItem value="AFG">AFG</MenuItem><MenuItem value="CH">CH</MenuItem><MenuItem value="CU">CU</MenuItem><MenuItem value="BJ">BJ</MenuItem><MenuItem value="PT">PT</MenuItem>
                    </Select>
                  </FormControl>
                  <TextField fullWidth margin="dense" label="Fecha Inicio" type="date" InputLabelProps={{ shrink: true }} inputProps={{ lang: 'es-ES' }} value={calendarFormData.fecha_inicio} onChange={(e) => setCalendarFormData({...calendarFormData, fecha_inicio: e.target.value})} required sx={{ mt: 2 }}/>
                  <TextField fullWidth margin="dense" label="Fecha Fin" type="date" InputLabelProps={{ shrink: true }} inputProps={{ lang: 'es-ES' }} value={calendarFormData.fecha_fin} onChange={(e) => setCalendarFormData({...calendarFormData, fecha_fin: e.target.value})} required sx={{ mt: 2 }}/>
                </DialogContent>
                <DialogActions>
                  {calendarFormData.id && <Button color="error" onClick={handleDeletePermisoCalendar}>Eliminar</Button>}
                  <Box flexGrow={1} />
                  <Button onClick={() => setDialogPermisoCalendar(false)}>Cancelar</Button>
                  <Button type="submit" variant="contained" color="primary">Guardar</Button>
                </DialogActions>
              </form>
            </Dialog>

            <Dialog open={dialogPermisoBloque} onClose={() => setDialogPermisoBloque(false)}>
              <form onSubmit={handleBloqueSubmit}>
                <DialogTitle>{bloqueFormData.id ? 'Modificar Permiso' : 'Añadir Permiso en Resumen Bloque'}</DialogTitle>
                <DialogContent>
                  <FormControl fullWidth margin="dense" size="small" sx={{ mt: 2 }}>
                    <InputLabel>Tipo de Permiso</InputLabel>
                    <Select value={bloqueFormData.tipo} label="Tipo de Permiso" onChange={(e) => setBloqueFormData({...bloqueFormData, tipo: e.target.value})} required>
                      <MenuItem value="AP">AP</MenuItem><MenuItem value="VA">VA</MenuItem><MenuItem value="AFG">AFG</MenuItem><MenuItem value="CH">CH</MenuItem><MenuItem value="CU">CU</MenuItem><MenuItem value="BJ">BJ</MenuItem><MenuItem value="PT">PT</MenuItem>
                    </Select>
                  </FormControl>
                  <TextField fullWidth margin="dense" label="Fecha Inicio" type="date" InputLabelProps={{ shrink: true }} inputProps={{ lang: 'es-ES' }} value={bloqueFormData.fecha_inicio} onChange={(e) => setBloqueFormData({...bloqueFormData, fecha_inicio: e.target.value})} required sx={{ mt: 2 }}/>
                  <TextField fullWidth margin="dense" label="Fecha Fin" type="date" InputLabelProps={{ shrink: true }} inputProps={{ lang: 'es-ES' }} value={bloqueFormData.fecha_fin} onChange={(e) => setBloqueFormData({...bloqueFormData, fecha_fin: e.target.value})} required sx={{ mt: 2 }}/>
                </DialogContent>
                <DialogActions>
                  <Button onClick={() => setDialogPermisoBloque(false)}>Cancelar</Button>
                  {bloqueFormData.id && <Button color="error" variant="outlined" onClick={(e) => { e.preventDefault(); handleDeletePermisoBloque(); }}>Eliminar Permiso Completo</Button>}
                  <Button type="submit" variant="contained" color="primary">Guardar</Button>
                </DialogActions>
              </form>
            </Dialog>

            <Dialog open={!!confirmDialog} onClose={() => setConfirmDialog(null)}>
              <DialogTitle>{confirmDialog?.title}</DialogTitle>
              <DialogContent><Typography>{confirmDialog?.text}</Typography></DialogContent>
              <DialogActions>
                <Button onClick={() => setConfirmDialog(null)}>Cancelar</Button>
                <Button onClick={confirmDialog?.onConfirm} variant="contained" color="primary">Confirmar</Button>
              </DialogActions>
            </Dialog>

            <Dialog open={dialogNuevaComision} onClose={() => setDialogNuevaComision(false)}>
              <form onSubmit={handleCrearComision}>
                <DialogTitle>Nueva Comisión de Servicio</DialogTitle>
                <DialogContent>
                  <TextField fullWidth margin="dense" label="Localidad (Ej: Melilla)" value={newComision.localidad} onChange={(e) => setNewComision({...newComision, localidad: e.target.value})} required />
                  <TextField fullWidth margin="dense" label="Fecha Inicio" type="date" InputLabelProps={{ shrink: true }} inputProps={{ lang: 'es-ES' }} value={newComision.fecha_inicio} onChange={(e) => setNewComision({...newComision, fecha_inicio: e.target.value})} required sx={{ mt: 2 }}/>
                  <TextField fullWidth margin="dense" label="Fecha Fin" type="date" InputLabelProps={{ shrink: true }} inputProps={{ lang: 'es-ES' }} value={newComision.fecha_fin} onChange={(e) => setNewComision({...newComision, fecha_fin: e.target.value})} required sx={{ mt: 2 }}/>
                </DialogContent>
                <DialogActions>
                  <Button onClick={() => setDialogNuevaComision(false)}>Cancelar</Button>
                  <Button type="submit" variant="contained" color="primary">Crear Comisión</Button>
                </DialogActions>
              </form>
            </Dialog>
            
          </Container>
        </ThemeProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
